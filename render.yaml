services:
  - type: web
    name: geowatch-monitor
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GEOWATCH_DB_URL
        fromDatabase:
          name: geowatch-db
          property: connectionString
      - key: GEOWATCH_API_TOKEN
        sync: false
      - key: AISSTREAM_API_KEY
        sync: false
      - key: GEOWATCH_WPI_RUNTIME
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: geowatch-db
    plan: free
    region: virginia
    postgresMajorVersion: 18
    ipAllowList: []
