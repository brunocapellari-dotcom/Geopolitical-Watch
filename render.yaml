services:
  - type: web
    name: geowatch-monitor
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GEOWATCH_DB_URL
        fromDatabase:
          name: geowatch-db
          property: connectionString
      - key: GEOWATCH_API_TOKEN
        sync: false
      - key: AISSTREAM_API_KEY
        sync: false
      - key: GEOWATCH_WPI_RUNTIME
        value: "1"
      - key: GEOWATCH_EMBEDDED_COLLECTOR
        value: "1"
      - key: GEOWATCH_COLLECT_CONFIG
        value: "config/sources.public-beta.json"
      - key: GEOWATCH_COLLECT_INTERVAL_SECONDS
        value: "3600"
      - key: GEOWATCH_RAW_BACKEND
        value: "postgres"
      - key: GEOWATCH_COOKIE_SECURE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: geowatch-db
    plan: free
    region: virginia
    postgresMajorVersion: "18"
    ipAllowList: []
