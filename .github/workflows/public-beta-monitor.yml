name: public-beta-monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: geowatch-public-beta
  cancel-in-progress: false

jobs:
  wake-runtime:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake zero-cost runtime and assert health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 3 --retry-delay 10 --max-time 120 https://geopolitical-watch.onrender.com/health >/dev/null

  public-beta:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore persistent beta state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/beta.db
            state/beta/
          key: geowatch-public-beta-v3-${{ github.run_id }}
          restore-keys: |
            geowatch-public-beta-v3-
      - name: Run public-source monitor
        run: |
          set -o pipefail
          mkdir -p data/raw reports state/beta
          python -m geowatch collect --config config/sources.public-beta.json --db data/beta.db --raw data/raw --reports reports | tee beta-run.json
      - name: Assert beta run health
        run: python scripts/assert_beta_run.py --run beta-run.json --db data/beta.db --reports reports
      - name: Build operational intelligence package
        run: |
          set -o pipefail
          python scripts/build_beta_summary.py --db data/beta.db --out reports/beta_coverage.json --run beta-run.json --episode-report reports/episodes/latest.json --state-dir state/beta | tee beta-summary-run.json
      - name: Publish situational summary
        if: always()
        run: |
          echo "# Geopolitical Watch public beta" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/beta_digest.md ]; then
            cat reports/beta_digest.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f reports/episodes/latest.md ]; then
            cat reports/episodes/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was generated. Inspect beta-run.json and job logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save persistent beta state
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/beta.db
            state/beta/
          key: geowatch-public-beta-v3-${{ github.run_id }}
      - name: Upload public beta artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geowatch-public-beta-${{ github.run_id }}
          path: |
            beta-run.json
            beta-summary-run.json
            data/beta.db
            data/raw/
            state/beta/
            reports/
          if-no-files-found: warn
          retention-days: 1
