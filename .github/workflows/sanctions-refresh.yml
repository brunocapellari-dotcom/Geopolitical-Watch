name: sanctions-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore previous sanctions snapshot cache
        uses: actions/cache/restore@v6
        with:
          path: .sanctions-cache
          key: sanctions-${{ github.run_id }}
          restore-keys: |
            sanctions-
      - name: Build official UNSC and UK snapshots/diffs
        run: |
          set -o pipefail
          python scripts/build_sanctions_artifacts.py | tee sanctions-run.json
      - name: Save current sanctions snapshot cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: .sanctions-cache
          key: sanctions-${{ github.run_id }}
      - name: Publish summary
        if: always()
        run: |
          echo "# Official sanctions refresh" >> "$GITHUB_STEP_SUMMARY"
          if [ -f generated/sanctions/summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat generated/sanctions/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanctions artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: geowatch-sanctions-${{ github.run_id }}
          path: |
            generated/sanctions/
            sanctions-run.json
          if-no-files-found: warn
          retention-days: 1
