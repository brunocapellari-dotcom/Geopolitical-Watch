name: sanctions-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Restore previous sanctions snapshot cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .sanctions-cache
          key: sanctions-${{ github.run_id }}
          restore-keys: |
            sanctions-
      - name: Build official UNSC and UK snapshots/diffs
        run: |
          set -o pipefail
          python scripts/build_sanctions_artifacts.py | tee sanctions-run.json
      - name: Save current sanctions snapshot cache
        if: success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .sanctions-cache
          key: sanctions-${{ github.run_id }}
      - name: Publish summary
        if: always()
        run: |
          echo "# Official sanctions refresh" >> "$GITHUB_STEP_SUMMARY"
          if [ -f generated/sanctions/summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat generated/sanctions/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanctions artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geowatch-sanctions-${{ github.run_id }}
          path: |
            generated/sanctions/
            sanctions-run.json
          if-no-files-found: warn
          retention-days: 1
