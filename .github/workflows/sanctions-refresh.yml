name: sanctions-refresh

on:
  # Production sanctions refresh now runs inside the zero-cost Render/Neon runtime.
  # Keep this workflow as an explicit manual fallback only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Restore previous sanctions snapshot cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sanctions-cache
          key: sanctions-${{ github.run_id }}
          restore-keys: |
            sanctions-
      - name: Build official UNSC and UK snapshots/diffs
        run: |
          set -o pipefail
          python scripts/build_sanctions_artifacts.py | tee sanctions-run.json
      - name: Save current sanctions snapshot cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sanctions-cache
          key: sanctions-${{ github.run_id }}
      - name: Publish summary
        if: always()
        run: |
          echo "# Official sanctions refresh" >> "$GITHUB_STEP_SUMMARY"
          if [ -f generated/sanctions/summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat generated/sanctions/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanctions artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geowatch-sanctions-${{ github.run_id }}
          path: |
            generated/sanctions/
            sanctions-run.json
          if-no-files-found: warn
          retention-days: 1
