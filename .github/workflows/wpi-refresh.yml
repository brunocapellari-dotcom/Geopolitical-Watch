name: wpi-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "11 4 * * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build official WPI candidate layer
        run: |
          set -o pipefail
          python scripts/build_wpi_artifacts.py | tee wpi-run.json
      - name: Publish summary
        if: always()
        run: |
          echo "# NGA World Port Index refresh" >> "$GITHUB_STEP_SUMMARY"
          if [ -f generated/wpi/summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat generated/wpi/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload WPI artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geowatch-wpi-${{ github.run_id }}
          path: |
            generated/wpi/
            wpi-run.json
          if-no-files-found: warn
          retention-days: 1
