name: autonomous-learning-audit

on:
  pull_request:
    paths:
      - "scripts/audit_autonomous_learning.py"
      - ".github/workflows/autonomous-learning-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-functional-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install existing project
        run: pip install -e .
      - name: Run isolated live collect-to-retrieve probe
        env:
          PYTHONPATH: .
          GEOWATCH_DB_URL: ""
          DATABASE_URL: ""
        run: python scripts/audit_autonomous_learning.py
      - name: Publish audit evidence without artifact storage
        if: always()
        run: |
          if [ -f audit-output/autonomous-learning-audit.json ]; then
            cat audit-output/autonomous-learning-audit.json
            echo '## Autonomous learning functional audit' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat audit-output/autonomous-learning-audit.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Audit output was not produced.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
