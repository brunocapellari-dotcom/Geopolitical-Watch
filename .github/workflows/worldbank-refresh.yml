name: worldbank-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build World Bank country/geoeconomic artifacts
        run: |
          set -o pipefail
          python scripts/build_worldbank_artifacts.py | tee worldbank-run.json
      - name: Publish summary
        if: always()
        run: |
          echo "# World Bank strategic baseline" >> "$GITHUB_STEP_SUMMARY"
          if [ -f generated/worldbank/summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat generated/worldbank/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload World Bank artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geowatch-worldbank-${{ github.run_id }}
          path: |
            generated/worldbank/
            worldbank-run.json
          if-no-files-found: warn
          retention-days: 1
