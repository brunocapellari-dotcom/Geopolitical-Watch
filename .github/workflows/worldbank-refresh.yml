name: worldbank-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build World Bank country/geoeconomic artifacts
        run: |
          set -o pipefail
          python scripts/build_worldbank_artifacts.py | tee worldbank-run.json
      - name: Publish summary
        if: always()
        run: |
          echo "# World Bank strategic baseline" >> "$GITHUB_STEP_SUMMARY"
          if [ -f generated/worldbank/summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat generated/worldbank/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload World Bank artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: geowatch-worldbank-${{ github.run_id }}
          path: |
            generated/worldbank/
            worldbank-run.json
          if-no-files-found: warn
          retention-days: 1
