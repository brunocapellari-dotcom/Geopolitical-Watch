name: worldbank-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build World Bank country/geoeconomic artifacts
        run: |
          set -o pipefail
          python scripts/build_worldbank_artifacts.py | tee worldbank-run.json
      - name: Publish summary
        if: always()
        run: |
          echo "# World Bank strategic baseline" >> "$GITHUB_STEP_SUMMARY"
          if [ -f generated/worldbank/summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat generated/worldbank/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload World Bank artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geowatch-worldbank-${{ github.run_id }}
          path: |
            generated/worldbank/
            worldbank-run.json
          if-no-files-found: warn
          retention-days: 1
