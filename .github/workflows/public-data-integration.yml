name: public-data-integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geowatch-public-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-public-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install canonical project runtime
        run: pip install .
      - name: Build UCDP bulk historical artifacts
        run: |
          set -o pipefail
          python scripts/build_ucdp_bulk_artifacts.py | tee ucdp-live.json
      - name: Export human review packets
        run: |
          set -o pipefail
          python scripts/export_human_review.py | tee human-review-live.json
      - name: Build layered empirical history
        run: |
          set -o pipefail
          python scripts/build_empirical_history_artifacts.py | tee empirical-live.json
      - name: Build NGA World Port Index artifacts
        run: |
          set -o pipefail
          python scripts/build_wpi_artifacts.py | tee wpi-live.json
      - name: Crossmatch WPI with UN LOCODE
        run: |
          set -o pipefail
          python scripts/build_unlocode_crossmatch.py | tee unlocode-live.json
      - name: Build World Bank strategic baseline
        run: |
          set -o pipefail
          python scripts/build_worldbank_artifacts.py | tee worldbank-live.json
      - name: Run bounded UN Comtrade strategic smoke
        run: |
          set -o pipefail
          python scripts/build_comtrade_pilot.py --smoke | tee comtrade-live.json
      - name: Build official sanctions snapshots
        run: |
          set -o pipefail
          python scripts/build_sanctions_artifacts.py | tee sanctions-live.json
      - name: Assert real public bootstrap sanity
        run: |
          set -o pipefail
          python scripts/assert_public_bootstrap.py | tee bootstrap-live.json
      - name: Build and assert v0.13 operational intelligence assets
        run: |
          set -o pipefail
          python scripts/build_v013_operational_assets.py | tee v013-live.json
      - name: Build and assert v0.14 operational learning assets
        run: |
          set -o pipefail
          python scripts/build_v014_operational_learning.py | tee v014-live.json
      - name: Publish validation summary
        if: always()
        run: |
          echo "# Geopolitical Watch — live public bootstrap" >> "$GITHUB_STEP_SUMMARY"
          for file in generated/public-bootstrap-smoke.json generated/ucdp/summary.json generated/empirical/summary.json generated/wpi/summary.json generated/unlocode/wpi_crossmatch.json generated/worldbank/summary.json generated/comtrade/summary.json generated/sanctions/summary.json generated/v013/operational_assets.json generated/v014/operational_learning.json generated/obsidian/monitor_conflitos/manifest.json; do
            if [ -f "$file" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "## $file" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload validation artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geowatch-public-data-integration-${{ github.run_id }}
          path: |
            generated/
            *-live.json
          if-no-files-found: warn
          retention-days: 1
