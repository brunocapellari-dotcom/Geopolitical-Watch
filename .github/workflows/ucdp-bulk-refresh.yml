name: ucdp-bulk-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build UCDP public bulk artifacts
        run: |
          set -o pipefail
          python scripts/build_ucdp_bulk_artifacts.py | tee ucdp-bulk-run.json
      - name: Build layered empirical history
        run: |
          set -o pipefail
          python scripts/build_empirical_history_artifacts.py | tee empirical-history-run.json
      - name: Publish summary
        if: always()
        run: |
          echo "# UCDP bulk refresh" >> "$GITHUB_STEP_SUMMARY"
          for file in generated/ucdp/summary.json generated/empirical/summary.json; do
            if [ -f "$file" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "## $file" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload UCDP historical artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geowatch-ucdp-bulk-${{ github.run_id }}
          path: |
            generated/ucdp/
            generated/empirical/
            ucdp-bulk-run.json
            empirical-history-run.json
          if-no-files-found: warn
          retention-days: 1
