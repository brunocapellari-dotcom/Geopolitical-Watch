name: ucdp-bulk-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build UCDP public bulk artifacts
        run: python scripts/build_ucdp_bulk_artifacts.py | tee ucdp-bulk-run.json
      - name: Publish summary
        if: always()
        run: |
          echo "# UCDP bulk refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f generated/ucdp/summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat generated/ucdp/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Bulk build did not produce a summary; inspect logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload UCDP historical artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geowatch-ucdp-bulk-${{ github.run_id }}
          path: |
            generated/ucdp/
            ucdp-bulk-run.json
          if-no-files-found: warn
          retention-days: 30
