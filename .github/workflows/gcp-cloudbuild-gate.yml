name: gcp-cloudbuild-gate

on:
  pull_request:
    branches:
      - main
      - release/go-live-20260929
  push:
    branches:
      - release/go-live-20260929
      - "stabilization/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geowatch-gcp-cloudbuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-cloudbuild:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      BUILD_SERVICE_ACCOUNT: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT || vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

    steps:
      - name: Require Google Cloud federation variables
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID"
          test -n "$WIF_PROVIDER"
          test -n "$BUILD_SERVICE_ACCOUNT"

      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud without service-account keys
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.BUILD_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Submit exact head to canonical Cloud Build gate
        shell: bash
        run: |
          set -euo pipefail
          gcloud builds submit .             --project "$PROJECT_ID"             --config cloudbuild.yaml             --substitutions "COMMIT_SHA=$GITHUB_SHA"             --quiet
