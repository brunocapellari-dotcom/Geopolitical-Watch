name: gcp-production-release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PUBLISH for the first scanned image only, or DEPLOY to update an already provisioned runtime"
        required: true
        type: string

jobs:
  full-project-gate:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: full-project-gate
    if: ${{ (inputs.confirm == 'PUBLISH' || inputs.confirm == 'DEPLOY') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'southamerica-east1' }}
      SERVICE_NAME: geowatch-monitor
      JOB_NAME: geowatch-source-tick

    steps:
      - name: Require GCP repository variables
        run: |
          test -n "$PROJECT_ID"
          test -n "${{ vars.GCP_WIF_PROVIDER }}"
          test -n "${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}"

      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud without a service-account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Artifact Registry Docker authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build immutable commit image locally
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/geowatch/geowatch:${GITHUB_SHA}"
          docker build --pull -t "$IMAGE" .
          echo "tag=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Scan exact release image before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Push exact scanned image and resolve digest
        id: push
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.image.outputs.tag }}"
          docker push "$IMAGE"
          DIGEST="$(gcloud artifacts docker images list "${REGION}-docker.pkg.dev/${PROJECT_ID}/geowatch/geowatch" --include-tags --filter="tags:${GITHUB_SHA}" --format='value(version)' --limit=1)"
          test -n "$DIGEST"
          PINNED="${REGION}-docker.pkg.dev/${PROJECT_ID}/geowatch/geowatch@${DIGEST}"
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          {
            echo "### Geopolitical-Watch immutable image"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Digest URI: \`${PINNED}\`"
            if [[ "${{ inputs.confirm }}" == "PUBLISH" ]]; then
              echo ""
              echo "Foundation bootstrap mode: use this digest as TF_VAR_container_image and set TF_VAR_deploy_runtime=true for the reviewed Terraform activation plan. No Cloud Run runtime was changed by this workflow."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update Cloud Run website to exact image digest
        if: ${{ inputs.confirm == 'DEPLOY' }}
        run: |
          gcloud run services update "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "${{ steps.push.outputs.pinned }}" \
            --quiet

      - name: Update scheduler job to exact image digest
        if: ${{ inputs.confirm == 'DEPLOY' }}
        run: |
          gcloud run jobs update "$JOB_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "${{ steps.push.outputs.pinned }}" \
            --quiet

      - name: Execute one production source tick
        if: ${{ inputs.confirm == 'DEPLOY' }}
        run: |
          gcloud run jobs execute "$JOB_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --wait

      - name: Smoke deployed health endpoint
        if: ${{ inputs.confirm == 'DEPLOY' }}
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          test -n "$URL"
          for _ in {1..20}; do
            if curl --fail --silent "$URL/health" | grep -q 'geopolitical-watch'; then
              echo "production health: ok"
              exit 0
            fi
            sleep 3
          done
          exit 1
