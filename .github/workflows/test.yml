name: full-project-gate

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: geowatch-full-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-project-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      GEOWATCH_TEST_POSTGRES_URL: postgresql://geowatch:geowatch@127.0.0.1:5432/geowatch

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Install PostgreSQL 16 and PostGIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-contrib postgis postgresql-16-postgis-3
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER geowatch WITH PASSWORD 'geowatch';"
          sudo -u postgres createdb -O geowatch geowatch
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d geowatch -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          pg_isready -h 127.0.0.1 -p 5432

      - name: Install production and gate dependencies
        run: pip install -e '.[production,test]'

      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run the entire repository gate
        shell: bash
        run: |
          set +e
          bash scripts/full_project_gate.sh
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "--- server log ---"
            cat /tmp/geowatch-full-gate-server.log 2>/dev/null || true
            echo "--- terraform init log ---"
            cat /tmp/geowatch-terraform-init.log 2>/dev/null || true
            exit "$code"
          fi

      - name: Scan production container for high and critical fixed vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: geowatch-full-gate:local
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
