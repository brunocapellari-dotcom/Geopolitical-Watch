name: zero-cost-scheduler

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geowatch-zero-cost-scheduler
  cancel-in-progress: false

jobs:
  source-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GEOWATCH_DB_URL: ${{ secrets.GEOWATCH_DB_URL }}
      GEOWATCH_RAW_BACKEND: s3
      GEOWATCH_RAW_S3_BUCKET: geowatch-raw
      GEOWATCH_RAW_PREFIX: raw
      AWS_ENDPOINT_URL_S3: https://br-lucky-breeze-b8g7mj8v.storage.c-14.us-east-1.aws.neon.tech
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.GEOWATCH_RAW_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.GEOWATCH_RAW_S3_SECRET_ACCESS_KEY }}
      GEOWATCH_ANALYSIS_CONFIG: config/sources.production.json

    steps:
      - name: Require runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEOWATCH_DB_URL"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check ".[production]"

      - name: Run one registry-driven tick
        run: python -m geowatch scheduler-tick
