version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Cuiaba"
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Cuiaba"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "terraform"
    directory: "/infra/gcp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Cuiaba"
    open-pull-requests-limit: 5
    groups:
      terraform-providers:
        patterns:
          - "*"
