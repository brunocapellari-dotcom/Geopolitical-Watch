[build-system]
requires = ["setuptools>=69,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "geopolitical-watch"
version = "0.14.0"
description = "Standalone public-source geopolitical conflict monitoring and strategic intelligence platform"
requires-python = ">=3.12"
license = {text = "Proprietary project scaffold; review upstream source terms before redistribution"}

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
gcp = ["google-cloud-storage>=2.18,<4"]
production = [
  "psycopg[binary]>=3.2,<4",
  "google-cloud-storage>=2.18,<4",
  "websockets>=15,<17",
  "defusedxml>=0.7.1,<1",
]

[tool.setuptools.packages.find]
include = ["geowatch*"]
